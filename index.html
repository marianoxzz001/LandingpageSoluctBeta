    <!-- Aplica o tema (dark por padrão) antes da 1a pintura, evitando flash de tema errado -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('solv-theme');
          if (stored === 'light') return;
          document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
